          folder = pathlib.Path('audio')
          folder.mkdir(exist_ok=True)
          def download(item):
              i, url = item
              target = pathlib.Path(tempfile.gettempdir()) / f'genital-{i}.wav'
              with urllib.request.urlopen(url, timeout=90) as response:
                  target.write_bytes(response.read())
              with wave.open(str(target), 'rb') as wav:
                  assert wav.getnframes() > 0
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(target),'-codec:a','libmp3lame','-b:a','96k',str(folder / f'{i}.mp3')],check=True)
              target.unlink()
              print(i)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(download, enumerate(urls)))
          sw = pathlib.Path('sw.js')
          sw.write_text(sw.read_text().replace('genital-v1','genital-neural-mp3-v3'),encoding='utf-8')
          PYTHON
      - name: Salvar no repositorio
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3 sw.js
          git diff --cached --quiet || git commit -m 'Adicionar 55 audios neurais locais'
          git push
